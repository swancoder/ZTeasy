# Full annotated example of the ZTE YAML policy schema (ADR-011, IdP URN
# sources ADR-014/ADR-015, agentMcpToolHolds ADR-019, mcpTarget ADR-023),
# demonstrating all four categories with ALLOW, DENY, and HOLD rules.
#
# This is documentation, not the file the gateway loads at runtime — the
# running default is gateway-service/src/main/resources/zte-policies.yaml,
# deliberately more conservative (see that file's header comment for why).
#
# Schema reference: docs/policy-schema.md

schemaVersion: 1

# ── users2service: human user (Keycloak realm role) → gateway REST service ──
users2service:
  - id: u2s-admin-full-access
    effect: ALLOW
    source: ADMIN              # realm role name
    target: "*"                # any service behind the gateway
    pathPattern: "/**"
    methods: "*"
    priority: 0

  - id: u2s-user-read-service-a
    effect: ALLOW
    source: USER
    target: service-a
    pathPattern: "/api/v1/service-a/**"
    methods: "GET"
    priority: 0

  # IdP URN source (ADR-014) — same effect as `source: ADMIN` above, but
  # addresses a specific synced Keycloak user rather than a whole role.
  - id: u2s-named-user-read-service-a
    effect: ALLOW
    source: "user:zte-admin"    # Keycloak preferred_username, synced into idp_identities
    target: service-a
    pathPattern: "/api/v1/service-a/**"
    methods: "GET"
    priority: 0

  - id: u2s-emergency-lockout-service-b
    effect: DENY                # DENY always wins, even over the ADMIN rule above
    source: "*"
    target: service-b
    pathPattern: "/api/v1/service-b/admin/**"
    methods: "*"
    priority: 100

# ── service2service: calling service/agent identity (JWT azp) → gateway REST service ──
service2service:
  # client:<clientId> URN source (ADR-015) — matches an OIDC client id synced
  # into idp_identities; the bare "agent-a" form still works identically
  # (backward compatible), same relationship role:ADMIN has to bare ADMIN.
  - id: s2s-agent-a-read-service-a
    effect: ALLOW
    source: "client:agent-a"
    target: service-a
    pathPattern: "/api/v1/service-a/**"
    methods: "GET"
    priority: 0

  - id: s2s-deny-agent-b-service-a
    effect: DENY
    source: "client:agent-b"
    target: service-a
    pathPattern: "/**"
    methods: "*"
    priority: 10

# ── agentMcpToolCalls: MCP agent identity (JWT azp) → MCP tool name ──
# pathPattern/methods are not used by this category (left absent/null).
agentMcpToolCalls:
  # Name-shape safety nets: deliberately no mcpTarget (ADR-023) — this
  # protection should hold regardless of which MCP backend is configured.
  - id: mcp-deny-delete-tools
    effect: DENY
    source: "*"
    target: "delete*"
    priority: 100

  - id: mcp-deny-export-all-data
    effect: DENY
    source: "*"
    target: export_all_data
    priority: 100

  # mcpTarget (ADR-023): matched against the configured mcp-backend.name —
  # these grants name real tools with real backend-specific semantics, so
  # they must stop applying if the gateway is ever repointed at a different
  # backend, rather than silently keep matching a same-named but different tool.
  - id: mcp-allow-agent-a-get-deals
    effect: ALLOW
    source: "client:agent-a"
    target: get_deals
    priority: 0
    mcpTarget: hubspot-mcp

  - id: mcp-allow-agent-b-update-deal-stage
    effect: ALLOW
    source: "client:agent-b"
    target: update_deal_stage
    priority: 0
    mcpTarget: hubspot-mcp

# ── agentMcpToolHolds (ADR-019): tool calls routed to a human even when ──
# agentMcpToolCalls above would ALLOW them — the demo's 🟡 outcome. Checked
# only *after* agentMcpToolCalls resolves to ALLOW; can only tighten a call
# into a HOLD, never loosen a DENY. Matched via PolicyMatcher.matchAny, not
# evaluate() — effect is unused here (kept ALLOW by convention; see
# docs/policy-schema.md's "Hold rules" section for why this isn't a third
# RuleEffect value shared with users2service/service2service). mcpTarget
# (ADR-023) scoped the same way as the grants above.
agentMcpToolHolds:
  - id: mcp-hold-agent-a-get-deals
    effect: ALLOW
    source: "client:agent-a"
    target: get_deals
    priority: 0
    mcpTarget: hubspot-mcp

# Anything not matched by an explicit rule above resolves to
# zte.policy.default-effect (application.yml — default DENY).
