[versions]
springBoot         = "3.4.3"
springCloud        = "2024.0.1"
springDependency   = "1.1.7"
bouncycastle       = "1.79"
jjwt               = "0.12.6"
keycloak-testcontainers = "3.3.1"
wiremock               = "3.0.4"
awaitility             = "4.2.2"
kotlin                 = "2.0.21"
spring-dotenv          = "4.0.0"
node-gradle            = "7.1.0"
springdoc-openapi      = "2.7.0"

[libraries]
# Spring Boot starters
spring-cloud-gateway      = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-oauth2-resource    = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security           = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-actuator           = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-jdbc               = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-web                = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-webflux            = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-r2dbc              = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }

# Database
flyway-core               = { module = "org.flywaydb:flyway-core" }
flyway-postgres            = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql-driver         = { module = "org.postgresql:postgresql" }
r2dbc-postgresql          = { module = "org.postgresql:r2dbc-postgresql" }

# Cryptography — BouncyCastle (X.509 cert utilities in auth-library)
bouncycastle-provider     = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix         = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# JWT — JJWT (OBO token creation/validation)
jjwt-api                  = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl                 = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson              = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Netty TLS (version managed by Spring Boot BOM)
netty-handler             = { module = "io.netty:netty-handler" }

# YAML policy file parsing (version managed by Spring Boot BOM's Jackson BOM)
jackson-dataformat-yaml   = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }

# Kotlin (version managed by kotlin plugin; stdlib version pinned by Spring Boot BOM)
kotlin-stdlib             = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
jackson-kotlin            = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
spring-dotenv             = { module = "me.paulschwarz:spring-dotenv", version.ref = "spring-dotenv" }

# OpenAPI schema (service-a/service-b, ADR-016 amendment) — WebFlux variant with Swagger UI
springdoc-openapi-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-openapi" }

# Test
spring-test               = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test      = { module = "org.springframework.security:spring-security-test" }
reactor-test              = { module = "io.projectreactor:reactor-test" }
# Kotlin-friendly Mockito (ADR-039): stubbing a suspendless reactive port from
# Kotlin with the Java API needs casts everywhere; this keeps the tests readable.
mockito-kotlin            = { module = "org.mockito.kotlin:mockito-kotlin", version = "5.4.0" }
testcontainers-junit5     = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
keycloak-testcontainers   = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "keycloak-testcontainers" }
rest-assured              = { module = "io.rest-assured:rest-assured" }
wiremock-standalone       = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
awaitility                = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

[plugins]
spring-boot               = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-mgmt    = { id = "io.spring.dependency-management", version.ref = "springDependency" }
kotlin-jvm                = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring             = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
node-gradle               = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
