# ── Integration-test Spring profile ──────────────────────────────────────────
# Applied when tests run with @ActiveProfiles("it").
# Disables mTLS cert loading (MtlsHttpClientConfig is @ConditionalOnProperty).
# All container URLs are injected via @DynamicPropertySource in BaseZteIntegrationTest.

server:
  ssl:
    enabled: false      # ADR-018: embedded test server stays plain HTTP — IT suite
                         # drives it via RestAssured over http://; independent of
                         # zte.mtls.enabled below (that one only gates the outbound
                         # client config in MtlsHttpClientConfig)

zte:
  # Stage 42: the suite reads its own policy document and its own ACAP profiles,
  # not the demo's — see zte-policies-it.yaml's header.
  policy:
    file: classpath:zte-policies-it.yaml
  acap:
    profiles-location: classpath:acap-profiles-it/*.yaml

  mtls:
    enabled: false      # skips MtlsHttpClientConfig — no client.p12 needed in tests
    key-password: it-fixture-unused   # nothing loads a keystore under this profile

  # ADR-037: the application no longer carries secret defaults, so the profile that
  # runs without an environment has to state its own. These are fixtures, matching
  # the values substituted into the generated IT realm — they authenticate to
  # containers that exist only for the duration of the run, and to nothing else.
  obo:
    secret: it-fixture-obo-signing-key
  idp:
    keycloak:
      client-secret: it-fixture-zte-gateway

# R2DBC pool: keep minimal for tests
spring:
  r2dbc:
    pool:
      initial-size: 1
      max-size: 2

# Suppress noisy gateway/security debug logs during tests
logging:
  level:
    root: WARN
    com.zte: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
