# ZTE YAML policy definitions (Stage 10 / ADR-011, Stage 11 / ADR-012,
# Stage 14 / ADR-015 — client:<clientId> URN sources for service2service/
# agentMcpToolCalls, Stage 1 / ADR-019 — agentMcpToolHolds, ADR-023 —
# mcpTarget).
#
# Schema: docs/policy-schema.md — full annotated example covering all four
# categories: docs/examples/zte-policies-example.yaml
#
# This is the file the running gateway actually loads by default
# (zte.policy.file, classpath:zte-policies.yaml). As of ADR-012, YAML is the
# sole source of truth for all four categories — there is no DB fallback for
# users2service anymore (the access_policies table/PolicyService were
# retired). No YAML match => deny for users2service/service2service, and
# zte.policy.default-effect for agentMcpToolCalls, same as before.
# agentMcpToolCalls/agentMcpToolHolds can be further tightened per-agent by
# an ACAP scope profile (Stage 3 / ADR-020, gateway-service/src/main/resources/acap-profiles/)
# — additive, never able to loosen what's granted here.
schemaVersion: 1

users2service:
  # Faithful migration of the old access_policies seed row (V2 Flyway
  # migration, now dropped by V3) — not a behavior change.
  - id: u2s-admin-service-a
    effect: ALLOW
    source: ADMIN
    target: service-a
    pathPattern: /api/v1/service-a/**
    methods: GET,POST

  # Admin Console API (ADR-012) — ADMIN role only.
  - id: u2s-admin-console-api
    effect: ALLOW
    source: ADMIN
    target: admin
    pathPattern: /api/v1/admin/**
    methods: "*"

  # Approval Center API (ADR-026) — any interactive user may decide held
  # calls for now (USER or ADMIN realm role). Two role-scoped rules rather
  # than one source "*" rule, deliberately: an agent's client-credentials JWT
  # carries no realm role, so agents can never reach this API to approve
  # their own held calls — only humans hold these roles. Tightening later to
  # a dedicated APPROVER role means editing these two rules, nothing else.
  - id: u2s-approver-api-user
    effect: ALLOW
    source: USER
    target: approver
    pathPattern: /api/v1/approver/**
    methods: "*"
  - id: u2s-approver-api-admin
    effect: ALLOW
    source: ADMIN
    target: approver
    pathPattern: /api/v1/approver/**
    methods: "*"

  # Executive dashboard (Stage 29, ADR-029). Each audience is a real realm
  # role, and each role is granted exactly the panels it needs — the tabs in
  # the UI are a reflection of these rules, not a substitute for them.
  # ADMIN sees everything (it already administers the policy set itself).
  - id: u2s-dashboard-admin
    effect: ALLOW
    source: ADMIN
    target: dashboard
    pathPattern: /api/v1/dashboard/**
    methods: "*"
  # CEO/BOARD: the whole overview, read-only.
  - id: u2s-dashboard-ceo
    effect: ALLOW
    source: CEO
    target: dashboard
    pathPattern: /api/v1/dashboard/**
    methods: GET
  - id: u2s-dashboard-board
    effect: ALLOW
    source: BOARD
    target: dashboard
    pathPattern: /api/v1/dashboard/**
    methods: GET
  # CFO: spend only. A deliberately narrower pathPattern rather than a role
  # check inside the controller — the gate decides, the app doesn't.
  - id: u2s-dashboard-cfo
    effect: ALLOW
    source: CFO
    target: dashboard
    pathPattern: /api/v1/dashboard/spend/**
    methods: GET
  # CTO: operations — agent activity, registry health.
  - id: u2s-dashboard-cto
    effect: ALLOW
    source: CTO
    target: dashboard
    pathPattern: /api/v1/dashboard/operations/**
    methods: GET
  # DPO: data-protection view — scopes and PII-relevant decisions.
  - id: u2s-dashboard-dpo
    effect: ALLOW
    source: DPO
    target: dashboard
    pathPattern: /api/v1/dashboard/data-protection/**
    methods: GET
  # Every role above also needs the shared summary tiles.
  - id: u2s-dashboard-summary-cfo
    effect: ALLOW
    source: CFO
    target: dashboard
    pathPattern: /api/v1/dashboard/summary
    methods: GET
  - id: u2s-dashboard-summary-cto
    effect: ALLOW
    source: CTO
    target: dashboard
    pathPattern: /api/v1/dashboard/summary
    methods: GET
  - id: u2s-dashboard-summary-dpo
    effect: ALLOW
    source: DPO
    target: dashboard
    pathPattern: /api/v1/dashboard/summary
    methods: GET

# When adding a rule, prefer the client:<clientId> URN form for source
# (ADR-015) — matches an OIDC client id synced into idp_identities, same as
# the bare form still does for backward compatibility.
  # ── ADR-039: the chat application's users ────────────────────────────────
  # Reaching the chat backend at all is a decision: the role is what grants it.
  - id: u2s-chat-user-chat-api
    effect: ALLOW
    source: CHAT_USER
    target: chat
    pathPattern: "/api/v1/chat/**"
    methods: "POST"
    priority: 0
  # A model call is a policy decision like any other — this is the rule that
  # makes spending money on tokens something a person is granted rather than
  # something an application can simply do.
  - id: u2s-chat-user-llm
    effect: ALLOW
    source: CHAT_USER
    target: llm
    pathPattern: "/api/v1/llm/**"
    methods: "POST"
    priority: 0
  # Everyone interactive may read their OWN trail; the query is scoped to them
  # in SQL, so this rule grants a view of oneself, not of the audit trail.
  - id: u2s-user-own-events
    effect: ALLOW
    source: USER
    target: me
    pathPattern: "/api/v1/me/**"
    methods: "GET"
    priority: 0
  - id: u2s-chat-user-own-events
    effect: ALLOW
    source: CHAT_USER
    target: me
    pathPattern: "/api/v1/me/**"
    methods: "GET"
    priority: 0
  - id: u2s-admin-own-events
    effect: ALLOW
    source: ADMIN
    target: me
    pathPattern: "/api/v1/me/**"
    methods: "GET"
    priority: 0

service2service:
  # ADR-017 — the 'service-a' Keycloak client (a machine identity for
  # exercising this filter specifically; NOT the real service-a app's own
  # internal direct-mTLS call to service-b, which never goes through the
  # gateway) may call service-b's normal /context endpoint...
  - id: s2s-service-a-service-b-context
    effect: ALLOW
    source: "client:service-a"
    target: service-b
    pathPattern: /api/v1/service-b/context
    methods: GET
  # ...but /restricted has no matching rule — deliberately omitted, not an
  # explicit DENY rule, so it falls through to zte.policy.default-effect
  # (deny-by-default) — proves the "no rule = no access" posture, not just
  # an explicit-DENY-rule posture.

agentMcpToolCalls:
  # Destructive/bulk-export shaped tool names are denied for every agent,
  # regardless of any ALLOW rule below — DENY always wins (see PolicyMatcher).
  # Deliberately NOT scoped to mcpTarget (ADR-023): this is a name-shape
  # safety net that should hold regardless of which MCP backend the gateway
  # is pointed at — a rule you want to keep protecting even if the backend
  # changes, unlike the specific per-agent grants below.
  - id: mcp-deny-delete-tools
    effect: DENY
    source: "*"
    target: "delete*"
    priority: 100
  - id: mcp-deny-drop-tools
    effect: DENY
    source: "*"
    target: "drop*"
    priority: 100
  - id: mcp-deny-export-all-data
    effect: DENY
    source: "*"
    target: "export_all_data"
    priority: 100

  # Explicit per-agent grants — everything else falls through to
  # zte.policy.default-effect (DENY). client:<clientId> URN form (ADR-015) —
  # validated against idp_identities (synced OIDC clients) on load/reload,
  # same as users2service sources already are. mcpTarget: hubspot-mcp
  # (ADR-023, matched against mcp-backend.name) on every grant below —
  # unlike the safety nets above, these name real tools with real
  # hubspot-mcp-specific semantics; if the gateway is ever repointed at a
  # different backend that happens to expose a same-named but different
  # tool, these grants must stop applying rather than silently keep firing.
  - id: mcp-allow-agent-a-get-deals
    effect: ALLOW
    source: "client:agent-a"
    target: get_deals
    priority: 10
    mcpTarget: hubspot-mcp
  - id: mcp-allow-agent-b-update-deal-stage
    effect: ALLOW
    source: "client:agent-b"
    target: update_deal_stage
    priority: 10
    mcpTarget: hubspot-mcp

  # Account-Health Assistant (ACAP demo — Nordwind Components,
  # docs/adr/ADR-019-hold-decision-and-approval-queue.md,
  # docs/adr/ADR-020-acap-scope-profiles.md). This coarse layer only grants
  # by tool name — the argument/field-level tightening (territory, allowed
  # fields, read-only) comes from this agent's ACAP profile
  # (gateway-service/src/main/resources/acap-profiles/crm-account-health-emea-01.yaml),
  # applied on top of whatever's granted here (ADR-020). Every read_* grant
  # below is coarse-only; a call with the wrong territory or a disallowed
  # field is still denied, just by the ACAP layer instead of this one.
  - id: mcp-allow-crm-account-health-read-contacts
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: read_contacts
    priority: 10
    mcpTarget: hubspot-mcp
  - id: mcp-allow-crm-account-health-read-deals
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: read_deals
    priority: 10
    mcpTarget: hubspot-mcp
  - id: mcp-allow-crm-account-health-read-activities
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: read_activities
    priority: 10
    mcpTarget: hubspot-mcp
  - id: mcp-allow-crm-account-health-send-email
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: send_email
    priority: 10
    mcpTarget: hubspot-mcp
  - id: mcp-allow-crm-account-health-draft-followup
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: draft_followup
    priority: 10
    mcpTarget: hubspot-mcp
  # Deliberately granted coarsely (ADR-020) even though the agent's ACAP
  # profile is read-only and will always deny it — demonstrates the RED
  # point from the demo script ("update_deal -> write.deny") as a genuine
  # two-layer interaction, not just an absence of any grant at all.
  - id: mcp-allow-crm-account-health-update-deal
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: update_deal
    priority: 10
    mcpTarget: hubspot-mcp

# Stage 1 (ADR-019): tool calls that must be routed to a human even when
# agentMcpToolCalls above would ALLOW them — the demo's 🟡 outcome. A
# separate list, not a third agentMcpToolCalls effect (see PolicyMatcher.matchAny's
# Javadoc for why). effect is unused here (matched via matchAny, not
# evaluate) but kept ALLOW by convention for readability. mcpTarget
# (ADR-023) scoped the same way as the grants above.
agentMcpToolHolds:
  - id: mcp-hold-crm-account-health-send-email
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: send_email
    mcpTarget: hubspot-mcp
    # ADR-034: an outbound email to a customer is the one held call with a named
    # owner. Everything else in this section stays open to any interactive user,
    # which is also what an absent routeTo means.
    routeTo: "role:APPROVER"

  - id: mcp-hold-crm-account-health-draft-followup
    effect: ALLOW
    source: "client:crm-account-health-emea-01"
    target: draft_followup
    mcpTarget: hubspot-mcp
