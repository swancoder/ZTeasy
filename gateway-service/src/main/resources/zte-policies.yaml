# ZTE YAML policy definitions (Stage 10 / ADR-011, Stage 11 / ADR-012,
# Stage 14 / ADR-015 — client:<clientId> URN sources for service2service/
# agentMcpToolCalls).
#
# Schema: docs/policy-schema.md — full annotated example covering all three
# categories: docs/examples/zte-policies-example.yaml
#
# This is the file the running gateway actually loads by default
# (zte.policy.file, classpath:zte-policies.yaml). As of ADR-012, YAML is the
# sole source of truth for all three categories — there is no DB fallback for
# users2service anymore (the access_policies table/PolicyService were
# retired). No YAML match => deny for users2service/service2service, and
# zte.policy.default-effect for agentMcpToolCalls, same as before.
schemaVersion: 1

users2service:
  # Faithful migration of the old access_policies seed row (V2 Flyway
  # migration, now dropped by V3) — not a behavior change.
  - id: u2s-admin-service-a
    effect: ALLOW
    source: ADMIN
    target: service-a
    pathPattern: /api/v1/service-a/**
    methods: GET,POST

  # Admin Console API (ADR-012) — ADMIN role only.
  - id: u2s-admin-console-api
    effect: ALLOW
    source: ADMIN
    target: admin
    pathPattern: /api/v1/admin/**
    methods: "*"

# Empty by default (fail-closed via zte.policy.default-effect). When adding a
# rule, prefer the client:<clientId> URN form for source (ADR-015) — matches
# an OIDC client id synced into idp_identities, same as the bare form still
# does for backward compatibility.
service2service: []

agentMcpToolCalls:
  # Destructive/bulk-export shaped tool names are denied for every agent,
  # regardless of any ALLOW rule below — DENY always wins (see PolicyMatcher).
  - id: mcp-deny-delete-tools
    effect: DENY
    source: "*"
    target: "delete*"
    priority: 100
  - id: mcp-deny-drop-tools
    effect: DENY
    source: "*"
    target: "drop*"
    priority: 100
  - id: mcp-deny-export-all-data
    effect: DENY
    source: "*"
    target: "export_all_data"
    priority: 100

  # Explicit per-agent grants — everything else falls through to
  # zte.policy.default-effect (DENY). client:<clientId> URN form (ADR-015) —
  # validated against idp_identities (synced OIDC clients) on load/reload,
  # same as users2service sources already are.
  - id: mcp-allow-agent-a-get-deals
    effect: ALLOW
    source: "client:agent-a"
    target: get_deals
    priority: 10
  - id: mcp-allow-agent-b-update-deal-stage
    effect: ALLOW
    source: "client:agent-b"
    target: update_deal_stage
    priority: 10
