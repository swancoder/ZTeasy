spring:
  application:
    name: gateway-service

  # ── Database (JDBC — used exclusively by Flyway for schema migrations) ──
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zte_db}
    username: ${DB_USER:zte_user}
    password: ${DB_PASSWORD:zte_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: flyway-pool
      maximum-pool-size: 2   # minimal — only for migrations at startup

  # ── Flyway schema migrations ──
  # Explicit JDBC URL required when spring-boot-starter-data-r2dbc is also on the
  # classpath — Spring Boot 3.4 does not always auto-select the JDBC DataSource for
  # Flyway in a dual JDBC+R2DBC configuration.
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zte_db}
    user: ${DB_USER:zte_user}
    password: ${DB_PASSWORD:zte_pass}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── R2DBC (reactive runtime writes — request_logs audit trail, ADR-013) ──
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zte_db}
    username: ${DB_USER:zte_user}
    password: ${DB_PASSWORD:zte_pass}
    pool:
      initial-size: 2
      max-size: 5
      max-idle-time: 30m

  # ── Spring Cloud Gateway: disable default web (use WebFlux) ──
  main:
    web-application-type: reactive

  # ── OAuth2 / JWT (Keycloak) ──
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak OIDC discovery endpoint — Gateway validates JWTs locally via JWKS
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/zte-realm}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/zte-realm/protocol/openid-connect/certs}

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: when-authorized

# ── Gateway ──
spring.cloud.gateway:
  # Disable default route discovery — routes are defined in GatewayRouteConfig
  discovery:
    locator:
      enabled: false
  # Forward the original Host header to downstream services
  forwarded-headers-strategy: FRAMEWORK

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: true
    key-store: file:${ZTE_CERTS_DIR:./certs}/gateway.p12
    key-store-password: ${ZTE_KEY_PASSWORD:zte-pass}
    key-store-type: PKCS12
    # ADR-018: "want", not "need" — the TLS handshake succeeds with or without a
    # client cert, so the Admin UI/Admin API/actuator stay cert-free over the same
    # port. Cert *presence* is enforced only for MCP/S2S paths, at the application
    # layer, by MtlsEnforcementWebFilter — not here.
    client-auth: want
    trust-store: file:${ZTE_CERTS_DIR:./certs}/truststore.p12
    trust-store-password: ${ZTE_KEY_PASSWORD:zte-pass}
    trust-store-type: PKCS12

# ── Downstream services — bootstrap seed values only (ADR-017): routing itself
#    is 100% inventory_services-driven (InventoryRouteDefinitionLocator); these
#    just save an operator from manually onboarding service-a/b via the Admin
#    Console on every fresh deploy (InventoryBootstrapSeeder, startup, once,
#    only if the name isn't already registered — never overwrites an existing,
#    possibly operator-edited entry) ──
service-a:
  uri: ${SERVICE_A_URI:https://localhost:8081}
service-b:
  uri: ${SERVICE_B_URI:https://localhost:8082}

# ── MCP proxy: downstream MCP server fronted by GET /sse + POST /message ──
mcp-backend:
  uri: ${MCP_BACKEND_URI:http://localhost:9090}
  # Purely a display label for request_logs.target_service (Audit Trail's "Target"
  # column) — this gateway only ever forwards to the single backend at uri above,
  # not looked up from the APIM Registry per-call, so this must be kept in sync
  # with whatever's actually running there by whoever configures MCP_BACKEND_URI.
  name: ${MCP_BACKEND_NAME:hubspot-mcp}

# ── mTLS outbound (gateway → service-a / service-b) ──
zte:
  mtls:
    certs-dir: ${ZTE_CERTS_DIR:./certs}
    key-password: ${ZTE_KEY_PASSWORD:zte-pass}
    refresh-interval-ms: 300000   # check keystore file every 5 min; hot-swap if changed

  # ── On-behalf-of token (X-ZTE-User-Context) ──
  obo:
    secret: ${ZTE_OBO_SECRET:zte-obo-dev-secret-change-in-production}
    expiry-seconds: ${ZTE_OBO_EXPIRY_SECONDS:30}

  # ── YAML policy definitions (Stage 10 / ADR-011) ──
  policy:
    file: ${ZTE_POLICY_FILE:classpath:zte-policies.yaml}
    default-effect: ${ZTE_POLICY_DEFAULT_EFFECT:DENY}
    user-client-id: ${ZTE_POLICY_USER_CLIENT_ID:zte-gateway}

  # ── Internal endpoints (/api/v1/internal/**) shared secret (ADR-027
  #    amendment). Blank = open, matching the original "reachable only on the
  #    Docker bridge" assumption for local dev. Set it (ZTE_INTERNAL_API_KEY,
  #    same value in zt-agents) for any deployment whose gateway is reachable
  #    from outside its own network — an ingress makes these endpoints public
  #    otherwise, policy document and reload included.
  internal:
    api-key: ${ZTE_INTERNAL_API_KEY:}

  # ── Keycloak reverse proxy (ADR-027): expose Keycloak's login surface under
  #    the gateway's own origin at /auth/** — for single-external-host
  #    deployments (Azure). Requires Keycloak to run with
  #    KC_HTTP_RELATIVE_PATH=/auth and KC_HOSTNAME_URL=<external>/auth.
  #    Off by default: local dev talks to Keycloak directly on :8180.
  auth-proxy:
    enabled: ${ZTE_AUTH_PROXY_ENABLED:false}
    uri: ${ZTE_AUTH_PROXY_URI:http://localhost:8180}

  # ── UI runtime config (ADR-026): OIDC authority served to both SPAs via
  #    GET /ui-config.js — override with ZTE_UI_OIDC_AUTHORITY when Keycloak
  #    is reverse-proxied under the gateway's own origin (ADR-027, Azure) ──
  ui:
    oidc-authority: ${ZTE_UI_OIDC_AUTHORITY:http://localhost:8180/realms/zte-realm}

  # ── ACAP per-agent scope profiles (Stage 3 / ADR-020) — additive, opt-in ──
  # tightening on top of agentMcpToolCalls/agentMcpToolHolds above. Unlike
  # policy.file, a location matching zero files is normal, not an error.
  acap:
    profiles-location: ${ZTE_ACAP_PROFILES_LOCATION:classpath:acap-profiles/*.yaml}

  # ── IdP identity sync (Stage 13 / ADR-014) ──
  idp:
    provider: ${ZTE_IDP_PROVIDER:keycloak}
    sync-interval-ms: ${ZTE_IDP_SYNC_INTERVAL_MS:900000}   # 15 min
    keycloak:
      base-uri: ${ZTE_IDP_KEYCLOAK_BASE_URI:http://localhost:8180}
      realm: ${ZTE_IDP_KEYCLOAK_REALM:zte-realm}
      client-id: ${ZTE_IDP_KEYCLOAK_CLIENT_ID:zte-gateway}
      client-secret: ${ZTE_IDP_KEYCLOAK_CLIENT_SECRET:zte-gateway-secret}

  # ── APIM inventory registry (Stage 16 / ADR-016) ──
  inventory:
    discovery-timeout-ms: ${ZTE_INVENTORY_DISCOVERY_TIMEOUT_MS:5000}
    health-poll-interval-ms: ${ZTE_INVENTORY_HEALTH_POLL_INTERVAL_MS:60000}   # 60s
    health-poll-timeout-ms: ${ZTE_INVENTORY_HEALTH_POLL_TIMEOUT_MS:3000}

  # ── Request audit trail exclusions (Stage 12 / ADR-013 amendment) ──
  # Path prefixes that never generate a request_logs row or ZteAuditLogger.requestLog(...)
  # line — deliberately separate from zte-policies.yaml (a structured, hot-reloadable rule
  # document); this is just a flat exclusion list, editable without a rebuild.
  audit:
    excluded-path-prefixes:
      - /admin/            # static SPA assets — no policy decision happens here
      - /api/v1/admin/     # Admin Console's own API — would otherwise create a
                            # self-referential noise loop (viewing the audit trail
                            # generates more audit trail)
      - /approver/         # Approval Center SPA assets (ADR-026) — same class as /admin/
      - /api/v1/approver/  # Approval Center API — the decision itself is already audited
                            # as an APPROVED/REJECTED MCP row by PendingApprovalService;
                            # a transport row per poll would just be noise
      - /ui-config.js      # runtime OIDC-authority snippet (ADR-026) — static config, no decision
      - /auth/             # reverse-proxied Keycloak login surface (ADR-027) — OIDC handshake
                            # noise, same class as /admin/ statics; no-op unless
                            # zte.auth-proxy.enabled
      - /api/v1/internal/  # zt-agents/ops internal endpoints — network-perimeter
                            # tooling traffic, not proxied-service traffic
      - /actuator/         # health checks — same class of noise
      - /v3/api-docs       # springdoc's self-served OpenAPI spec + bundled Swagger UI
      - /swagger-ui        # (Stage 25 / ADR-025) — same class of noise as /admin/
      - /sse               # MCP proxy (ADR-017 unification) — LoggingMcpAuditService
      - /message           # already writes one enriched request_logs row per tool call
                            # (HTTP context + MCP semantics together); this filter's own
                            # transport-only row would just duplicate it

# ── Logging ──
logging:
  level:
    root: INFO
    com.zte: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
