# ADR-037: no secret has a default here. A default committed to a public repo is a
# published credential — this project shipped one to a live deployment and only
# noticed months later. Locally these come from the gitignored .env written by
# scripts/generate-dev-secrets.sh (read by spring-dotenv); everywhere else the
# environment must supply them, and startup fails loudly if it does not.
spring:
  application:
    name: service-a
  main:
    web-application-type: reactive

# ── HTTPS server with mTLS ──────────────────────────────────────────────────
# Requires a valid client certificate signed by the ZTE CA.
# Run certs/generate-certs.sh once to generate keystores before starting.
server:
  port: ${SERVER_PORT:8081}
  ssl:
    enabled: true
    key-store: file:${ZTE_CERTS_DIR:./certs}/service-a.p12
    key-store-password: ${ZTE_KEY_PASSWORD}
    key-store-type: PKCS12
    # need = reject connections without a valid client cert
    client-auth: need
    trust-store: file:${ZTE_CERTS_DIR:./certs}/truststore.p12
    trust-store-password: ${ZTE_KEY_PASSWORD}
    trust-store-type: PKCS12

# ── Separate HTTP management port (no client cert required for health probes) ──
management:
  server:
    port: ${MANAGEMENT_PORT:9081}
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

# ── mTLS outbound (service-a → service-b) ──────────────────────────────────
service-b:
  uri: ${SERVICE_B_URI:https://localhost:8082}

zte:
  mtls:
    certs-dir: ${ZTE_CERTS_DIR:./certs}
    key-password: ${ZTE_KEY_PASSWORD}

  # OBO token validation — same secret as the gateway
  obo:
    secret: ${ZTE_OBO_SECRET}
    expiry-seconds: ${ZTE_OBO_EXPIRY_SECONDS:30}

logging:
  level:
    root: INFO
    com.zte.servicea: DEBUG
