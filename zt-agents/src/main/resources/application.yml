spring:
  application:
    name: zt-agents

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# ── Anthropic API ──
anthropic:
  api-key: ${ANTHROPIC_API_KEY}          # required — set via env var; never commit a real key
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
  timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:120}

# ── Gateway connection ──
zte:
  gateway:
    internal-uri: ${GATEWAY_INTERNAL_URI:http://localhost:8080}
    # PEM of the CA that signed the gateway's server certificate. GatewayWebClients
    # has honoured this since ADR-029, but nothing ever set it — so every call to
    # the gateway (metering included) failed TLS validation against the JVM's
    # public-CA trust, silently, because metering is fire-and-forget (ADR-033).
    ca-cert: ${ZTE_GATEWAY_CA_CERT:}

logging:
  level:
    root: INFO
    com.zte.agents: DEBUG
